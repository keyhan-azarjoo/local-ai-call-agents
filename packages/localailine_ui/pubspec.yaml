name: localailine_ui
description: "LocalAILine's pages and widgets (Flutter). They work against AppModel, so the same pages run in the desktop app (on the engine) and on the web (on a remote engine)."
version: 0.9.0
repository: https://github.com/keyhan-azarjoo/local-ai-call-agents
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.6.0
  path: ^1.9.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  file_selector: ^1.1.0
  livekit_client: ^2.13.0
  localailine_model:
    path: ../localailine_model

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
