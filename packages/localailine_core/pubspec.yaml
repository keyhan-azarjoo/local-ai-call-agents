    path: ../localailine_model
  archive: ^4.3.0
  cryptography: ^2.9.0
  http: ^1.6.0
  path: ^1.9.1
  pdfrx_engine: ^0.4.7
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  test: any
