<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalLine — design demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <!-- Incoming call -->
  <div class="overlay" id="ring">
    <div class="ringcard">
      <div class="eyebrow" style="color:#8fa6c2">Incoming call · Twilio · +44 20 3870 1142</div>
      <div class="ring-lamp"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f2a93b" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div>
      <div style="font-family:var(--f-display);font-size:22px;font-weight:700">Sarah Mitchell</div>
      <div class="num">+44 7700 900 123</div>
      <div class="small" style="color:#8fa6c2">Known contact · VIP · last called 3 days ago</div>
      <div class="small" style="margin-top:14px;color:#c9d6e6">AI answers automatically in <b class="mono" id="ringCount" style="color:#f2a93b">3</b>s</div>
      <div class="btns">
        <button class="btn green" onclick="answer('ai')">Let AI answer</button>
        <button class="btn amber" onclick="answer('me')">Answer myself</button>
        <button class="btn danger" onclick="closeRing()">Decline</button>
      </div>
      <button class="btn ghost sm" style="margin-top:10px;color:#8fa6c2" onclick="closeRing()">Send to voicemail</button>
    </div>
  </div>

  <div class="overlay" id="modal"><div class="modal" id="modalBody"></div></div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
