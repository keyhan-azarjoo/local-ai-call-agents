name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests (everything except the ones that need the voice and AI engines running)
        run: flutter test $(ls test/*_test.dart test/scenarios/*_test.dart | grep -v live_test)
