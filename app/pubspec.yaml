name: localailine
description: "LocalAILine — your computer answers and makes your calls with a private, local AI."
publish_to: 'none'

version: 0.9.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  http: ^1.6.0
  provider: ^6.1.5+1
  cryptography: ^2.9.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  file_selector: ^1.1.0
  pdfrx: ^2.4.8
  archive: ^4.3.0
  livekit_client: ^2.13.0

  # The open LocalAILine packages (see ../packages).
  localailine_model:
    path: ../packages/localailine_model
  localailine_core:
    path: ../packages/localailine_core
  localailine_apps:
    path: ../packages/localailine_apps
  localailine_engine:
    path: ../packages/localailine_engine
  localailine_ui:
    path: ../packages/localailine_ui
  # The phone gateway's Go source, built on first use (see packages/localailine_sipgw).
  localailine_sipgw:
    path: ../packages/localailine_sipgw

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/catalog/
    # The voice engine's scripts run on a computer only. The App Store refuses an iPhone app
    # that carries .py files, so phones and the web don't get them.
    - path: assets/engine/
      platforms: [macos, windows, linux]
    - path: assets/engine/sipreg/
      platforms: [macos, windows, linux]
    - assets/scenarios/

  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf

